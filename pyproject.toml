[project]
name = "okvorado"
version = "0.1.0"
description = "Interface de management Akvorado — pilotage et lecture métier des flux NetFlow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "clickhouse-connect>=0.8",
    "httpx>=0.27",
    "ruamel.yaml>=0.18",
    "python-multipart>=0.0.12",
    "pysnmp>=7.1",
    "cryptography>=44.0.1",
    "qrcode>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` / `Query()` en argument par défaut est le pattern OFFICIEL de FastAPI :
# le framework les résout à chaque requête, ce n'est pas un défaut mutable partagé.
# B008 est un faux positif sur ces appels précis.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["clickhouse_connect.*", "ruamel.*", "docker.*", "pysnmp.*"]
ignore_missing_imports = true

# `restart-agent/agent.py` vit HORS du package `app` (service separe, seul a monter
# le socket docker). Les tests l'importent via sys.path : mypy ne peut pas le
# resoudre comme un module du package, sans que ce soit une erreur reelle.
[[tool.mypy.overrides]]
module = ["agent"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
